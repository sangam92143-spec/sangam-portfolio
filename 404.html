<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | Sangam Singh</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved. Return to Sangam Singh's official portfolio.">
  <link href="/public/favicon.svg" rel="icon" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 60, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      color: #999;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #ffffff;
      color: #000000;
    }
    .btn-primary:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="badge">Error 404</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The link you followed may be broken or the page may have been moved. Let's get you back on track.</p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">Return to Home</a>
      <a href="https://cal.com/sangam-singh/30min" target="_blank" rel="noopener" class="btn btn-secondary">Book 30-Min Call</a>
    </div>
  </div>
</body>
</html>
